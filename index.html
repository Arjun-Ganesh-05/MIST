<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIST WebDev Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="image.png" alt="MIST Logo" class="logo" />
    <h2>Name, Reg Number, Contact Number of person submitting</h2>
  </header>

  <main>
    <section class="form-section">
      <label>Enter Name <span>(Should be letters only)</span></label>
      <input type="text" id="name" placeholder="Enter name" />

      <label>Enter Reg Number <span>(Should be 9 numbers only)</span></label>
      <input type="text" id="reg" placeholder="Enter registration number" maxlength="9" />

      <label>Enter birthday <span>(Use react calendar form validation here)</span></label>
      <input type="date" id="birthday" />

      <div class="question">
        <p>Is webdev the best domain? :)</p>
        <button id="yesBtn" class="yes">YES</button>
        <button id="noBtn" class="no">NO</button>
      </div>
    </section>

    <section class="output-section">
      <div class="sheet">
        <h3>MIST Mancomm Member 69</h3>
        <p><strong>My name is:</strong> <span id="outName"></span></p>
        <p><strong>My registration number is:</strong> <span id="outReg"></span></p>
        <p><strong>My birthday is on:</strong> <span id="outBirthday"></span></p>
        <div class="question-output">
          <p>Is webdev the best domain? :)</p>
          <button id="outYes" class="yes">YES</button>
          <button id="outNo" class="no">NO</button>
        </div>
      </div>

      <div class="submitted-by">
        <p><strong>My name is:</strong> Arjun</p>
        <p><strong>Reg no:</strong> 240905238</p>
        <p><strong>Contact number:</strong> 8904290605</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
